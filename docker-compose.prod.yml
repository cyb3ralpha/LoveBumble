version: '3.8'

services:
  db:
    image: mariadb:10.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-love_bumble}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql

  php:
    build: ./docker/php
    depends_on:
      - db
    volumes:
      - ./:/var/www/html:cached
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-root}
      - DB_PASS=${MYSQL_PASSWORD:-rootpassword}
      - DB_NAME=${MYSQL_DATABASE:-love_bumble}

  realtime:
    build: ./docker/realtime
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-root}
      - DB_PASS=${MYSQL_PASSWORD:-rootpassword}
      - DB_NAME=${MYSQL_DATABASE:-love_bumble}
    ports:
      - "5000:5000"

  nginx:
    image: nginx:stable
    depends_on:
      - php
      - realtime
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  db_data:
